name: Verify public R9 research snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out committed source and data
        uses: actions/checkout@v4
      - name: Setup recorded Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Validate tracked SHA-256 manifest and publication hygiene
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess
          manifest = json.loads(Path('FILE_SHA256.json').read_text(encoding='utf-8'))
          tracked = set(filter(None,subprocess.check_output(['git','ls-files','-z']).decode().split('\0')))
          assert tracked - {'FILE_SHA256.json'} == set(manifest), f'Manifest/checkout mismatch: {tracked ^ (set(manifest) | {"FILE_SHA256.json"})}'
          for rel in sorted(manifest):
              actual = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              assert actual == manifest[rel], f'SHA-256 mismatch: {rel}'
          assert not [p for p in tracked if p.lower().endswith(('.pdf','.doc','.docx','.zip','.xlsx','.pptx'))], 'Restricted/document file type in public repository'
          indicators = (
              re.compile('gh[pousr]_' + '[A-Za-z0-9]{30,}'),
              re.compile('github_pat_' + '[A-Za-z0-9_]{30,}'),
              re.compile('AKIA' + '[0-9A-Z]{16}'),
              re.compile('-----BEGIN ' + '(RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          )
          for rel in sorted(tracked):
              if Path(rel).suffix.lower() not in {'.py','.md','.json','.txt','.yml','.yaml'}: continue
              body=Path(rel).read_text(encoding='utf-8')
              assert not any(p.search(body) for p in indicators), f'Credential-like text in {rel}'
              if rel.endswith('.md'):
                  for item in re.findall(r'\]\(([^)]+)\)',body):
                      if item.startswith(('https://','http://','mailto:','#')): continue
                      link=item.split('#',1)[0]
                      if link: assert (Path(rel).parent / link).exists(), f'Broken local Markdown link in {rel}: {link}'
          print('TRACKED_SHA256_AND_PUBLICATION_SCREEN: PASS',len(manifest), 'manifest files')
          PY
      - name: Install pinned scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all supplied Python sources
        run: python -m compileall -q 57_H3_Airfoil_R5/code R6_EXTENSION/analysis R9_EXTENSION/code scripts tests
      - name: Run 17 mathematical controls and published CSV consistency checks
        run: python tests/check_release.py
