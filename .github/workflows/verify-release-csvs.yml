name: Verify R9 snapshot and publish exact CSVs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-release-csvs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verified-tables:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out recorded Git commit
        uses: actions/checkout@v4
      - name: Setup recorded Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Verify every tracked source/output SHA-256 before restoration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          manifest = json.loads(Path('FILE_SHA256.json').read_text())
          tracked = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().strip('\0').split('\0'))
          missing = {'results/r6/R6_MATCHED_PAIRS_0p5.csv', 'results/r9/SHARED_SUPPORT_PAIRS.csv'}
          assert set(manifest) - tracked == missing, f'Unexpected manifest-only files: {set(manifest) - tracked}'
          unlisted = tracked - set(manifest) - {'FILE_SHA256.json', '.github/workflows/verify-release-csvs.yml'}
          assert not unlisted, f'Unmanifested files: {unlisted}'
          for rel in sorted(set(manifest) - missing):
              actual = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              assert actual == manifest[rel], f'SHA-256 mismatch: {rel}'
          print('TRACKED_MANIFEST_SHA256: PASS',len(manifest)-len(missing), 'files')
          PY
      - name: Restore exact source CSV bytes
        run: python scripts/restore_large_tables.py
      - name: Install recorded environment
        run: python -m pip install -r requirements.txt
      - name: Rerun portable mathematical and output checks
        run: python tests/check_release.py
      - name: Publish only verified original R6 and R9 CSV bytes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('FILE_SHA256.json').read_text())
          for rel in ['results/r6/R6_MATCHED_PAIRS_0p5.csv','results/r9/SHARED_SUPPORT_PAIRS.csv']:
              actual=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              assert actual == manifest[rel], f'MISMATCH: {rel}'
              print('PUBLISH_SHA256_VERIFIED:', rel, actual)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/r6/R6_MATCHED_PAIRS_0p5.csv results/r9/SHARED_SUPPORT_PAIRS.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish SHA-256 verified full R6 and R9 CSVs [verified tables]"
            git push origin HEAD:main
          else
            echo "Both full CSV files already tracked with identical contents."
          fi
