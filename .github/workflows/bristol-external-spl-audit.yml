name: Probe Bristol original far-field SPL HDF5
on:
  push:
    branches:
      - research/bristol-external-spl-audit-20261123
    paths:
      - 'research/bristol_external_spl/bristol_source_probe.py'
      - 'research/bristol_external_spl/bristol_model_audit.py'
      - '.github/workflows/bristol-external-spl-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install HDF5 and modeling dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'threadpoolctl>=3.2,<4' 'pandas>=2,<3' 'h5py>=3.10,<4' 'requests>=2.31,<3'
      - name: Source acquisition and schema inventory (no raw data published)
        run: python research/bristol_external_spl/bristol_source_probe.py
      - name: Execute source-hash-locked angle and geometry holdout experiments
        run: python research/bristol_external_spl/bristol_model_audit.py
      - name: Upload summary-only audit (no external raw data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bristol-source-locked-audit
          path: |
            research/bristol_external_spl/probe_inventory.json
            research/bristol_external_spl/experiment_results.json
          if-no-files-found: warn
      - name: Commit reproducible metadata-only outputs on experiment branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/bristol_external_spl/probe_inventory.json research/bristol_external_spl/experiment_results.json
          git diff --cached --quiet || (git commit -m 'research: Bristol source-only external experiment summary' && git push)
